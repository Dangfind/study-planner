services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_planner}
      POSTGRES_DB: ${POSTGRES_DB:-study_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-study_planner}:${POSTGRES_PASSWORD:-study_planner}@db:5432/${POSTGRES_DB:-study_planner}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  frontend_node_modules:
  backend_node_modules:
